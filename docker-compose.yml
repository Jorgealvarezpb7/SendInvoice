services:
  database:
    image: 'postgres:15.6'
    ports:
      - '5432:5432'
    volumes:
      - database:/var/lib/postgresql/data
    env_file:
      - .env
    restart: always

  latex_compiler:
    image: 'ghcr.io/whizzes/latex_compiler:f34ed7d'
    ports:
      - '9000:9000'
    restart: always

volumes:
  database:
